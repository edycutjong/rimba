<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label='RIMBA — the chain resolves the call. An ochre-pencilled field card — "moves again within 15 min: YES, 72%" — stamped green RESOLVED by checkpoint, three cited notes beneath.'>
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: teal plate, cream field card in its OPEN state (ochre band, ochre countdown bar full). Poster-complete.
  10-28%  trigger:      the countdown drains; a checkpoint tile drops toward the card (the resolving checkpoint arrives)   data-story="beat-2"
  28-55%  mechanism:    An ochre-pencilled field card — "moves again within 15 min: YES, 72%" — stamped green RESOLVED by checkpoint, three cited notes beneath.   data-story="beat-3"
  55-88%  resolution:   the stamp STAYS; band and bar stay green; a glow breath around the stamp   data-story="beat-4"
  88-100% breathe + seam fade: stamp fades out, band and bar return to ochre-full, identical to frame 0
-->
  <style>
    [data-story] { transform-box: fill-box; transform-origin: center; }
    .slam { transform-box: fill-box; transform-origin: center; animation: slam 6s cubic-bezier(.2, 1.4, .4, 1) infinite; }
    @keyframes slam {
      0%, 29% { transform: scale(1.9) rotate(-8deg); }
      34%     { transform: scale(.94) rotate(1deg); }
      38%     { transform: scale(1) rotate(0deg); }
      100%    { transform: scale(1) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11363C"/>
      <stop offset="100%" stop-color="#081E22"/>
    </linearGradient>
    <clipPath id="card-clip"><rect x="92" y="112" width="300" height="226" rx="16"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="breath" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#24474D" stroke-width="4"/>
  <g transform="translate(256 252) scale(1.1) translate(-256 -260)">
    <!-- field card, open state at t=0 -->
    <g transform="rotate(-6 242 225)" filter="url(#lift)">
      <rect x="92" y="112" width="300" height="226" rx="16" fill="#F2EAD3"/>
      <g clip-path="url(#card-clip)">
        <rect x="92" y="112" width="40" height="226" fill="#D4A83A">
          <animate attributeName="fill" dur="6s" repeatCount="indefinite" values="#D4A83A;#D4A83A;#5FD3A8;#5FD3A8;#D4A83A;#D4A83A" keyTimes="0;0.3;0.33;0.9;0.97;1"/>
        </rect>
      </g>
      <path d="M160 168H352M160 212H312" stroke="#0D2B30" stroke-width="16" stroke-linecap="round"/>
      <rect x="160" y="250" width="180" height="16" rx="8" fill="#D9CFB2"/>
      <rect x="160" y="250" width="180" height="16" rx="8" fill="#D4A83A">
        <animate attributeName="width" dur="6s" repeatCount="indefinite" values="180;180;64;64;180;180" keyTimes="0;0.1;0.28;0.9;0.97;1"/>
        <animate attributeName="fill" dur="6s" repeatCount="indefinite" values="#D4A83A;#D4A83A;#5FD3A8;#5FD3A8;#D4A83A;#D4A83A" keyTimes="0;0.3;0.33;0.9;0.97;1"/>
      </rect>
    </g>
    <!-- beat 2: the resolving checkpoint drops in -->
    <g data-story="beat-2" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.26;0.3;1"/>
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" values="0 0;0 0;-70 150;-70 150" keyTimes="0;0.1;0.29;1"/>
      <rect x="378" y="150" width="44" height="44" rx="8" fill="#F2EAD3" stroke="#0D2B30" stroke-width="5"/>
      <path d="M390 166H410M390 178H404" stroke="#0D2B30" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- beat 4: glow breath under the stamp -->
    <g data-story="beat-4" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;0.8;0.25;0.7;0;0" keyTimes="0;0.33;0.45;0.6;0.75;0.88;1"/>
      <rect x="226" y="292" width="208" height="120" rx="16" fill="#5FD3A8" filter="url(#breath)" transform="rotate(-14 330 352)"/>
    </g>
    <!-- beat 3: the stamp lands and stays -->
    <g transform="translate(330 352) rotate(-14)">
      <g data-story="beat-3" opacity="0">
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.9;0.96;1"/>
        <g class="slam" filter="url(#lift)">
          <rect x="-104" y="-60" width="208" height="120" rx="16" fill="#5FD3A8" stroke="#0D2B30" stroke-width="12"/>
          <rect x="-88" y="-44" width="176" height="88" rx="8" fill="none" stroke="#F2EAD3" stroke-width="5"/>
          <path d="M-46 2L-12 32L50 -30" fill="none" stroke="#0D2B30" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
