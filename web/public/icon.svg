<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RIMBA — a pencilled field card stamped RESOLVED by the chain">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--panel, #11363C)"/>
      <stop offset="100%" stop-color="var(--bg-deep, #081E22)"/>
    </linearGradient>
    <clipPath id="card-clip"><rect x="92" y="112" width="300" height="226" rx="16"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- plate: self-sufficient on GitHub light AND dark -->
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="var(--rule, #24474D)" stroke-width="4"/>
  <g transform="translate(256 252) scale(1.1) translate(-256 -260)">
  <!-- the field card: open call, ochre pencil band -->
  <g transform="rotate(-6 242 225)" filter="url(#lift)">
    <rect x="92" y="112" width="300" height="226" rx="16" fill="var(--paper, #F2EAD3)"/>
    <g clip-path="url(#card-clip)">
      <rect x="92" y="112" width="40" height="226" fill="var(--primary, #D4A83A)"/>
    </g>
    <path d="M160 168H352M160 212H312" stroke="var(--paper-ink, #0D2B30)" stroke-width="16" stroke-linecap="round"/>
    <rect x="160" y="250" width="180" height="16" rx="8" fill="var(--paper-rule, #D9CFB2)"/>
    <rect x="160" y="250" width="92" height="16" rx="8" fill="var(--primary, #D4A83A)"/>
  </g>
  <!-- the stamp: resolved by the chain, lands across the corner -->
  <g transform="translate(330 352) rotate(-14)" filter="url(#lift)">
    <rect x="-104" y="-60" width="208" height="120" rx="16" fill="var(--accent, #5FD3A8)" stroke="var(--paper-ink, #0D2B30)" stroke-width="12"/>
    <rect x="-88" y="-44" width="176" height="88" rx="8" fill="none" stroke="var(--paper, #F2EAD3)" stroke-width="5"/>
    <path d="M-46 2L-12 32L50 -30" fill="none" stroke="var(--paper-ink, #0D2B30)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
