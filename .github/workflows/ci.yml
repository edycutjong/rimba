name: CI
# 6-stage pipeline:
#   Stage 1 Quality ─┐
#                    ├─→ Stage 3 Build ─→ Stage 4 E2E ─┐
#   Stage 2 Security ┘                └─→ Stage 5 Performance ─┴─→ Stage 6 Deploy (main only)
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # ── STAGE 1: Quality (parallel with Stage 2) ─────────────────────────────
  check:
    name: "Stage 1 · Quality (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on pushes to main, one Node on PRs.
        node: ${{ github.event_name == 'push' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit + integration tests
        run: pnpm test

  # ── STAGE 2: Security (parallel with Stage 1) ────────────────────────────
  secret-scan:
    name: "Stage 2 · Secret scan (gitleaks, full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact

  dependency-audit:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high + critical, production deps)
        run: pnpm audit --prod --audit-level=high
      - name: pnpm audit (web)
        working-directory: web
        run: pnpm audit --prod --audit-level=high

  # ── STAGE 3: Build ───────────────────────────────────────────────────────
  build:
    name: "Stage 3 · Build + bundle budget"
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Web build
        working-directory: web
        run: pnpm install --ignore-workspace --frozen-lockfile && pnpm build
      - name: Bundle budget (JS + CSS, excluding fonts and data)
        working-directory: web
        run: |
          kb=$(find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -exec cat {} + | wc -c | awk '{printf "%d", $1/1024}')
          echo "JS+CSS: ${kb} KB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$kb" -gt 400 ]; then echo "::error::bundle ${kb} KB exceeds the 400 KB budget"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  # ── STAGE 4: E2E ─────────────────────────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E (Playwright, Chromium)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web deps (for vite preview)
        working-directory: web
        run: pnpm install --ignore-workspace --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── STAGE 5: Performance ─────────────────────────────────────────────────
  performance:
    name: "Stage 5 · Performance (bench budgets)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm bench (p50/p95, measured on the runner)
        run: pnpm -s bench | tee bench.md
      - name: Budgets (p95 — generous for shared runners)
        run: |
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
          p95() { grep -F "$1" bench.md | awk -F'|' '{gsub(/ /,"",$5); print $5}'; }
          check() { v=$(p95 "$1"); echo "$1 p95=${v} ms (budget $2 ms)"; awk -v v="$v" -v b="$2" 'BEGIN{exit !(v!="" && v+0<=b+0)}' || { echo "::error::$1 p95 ${v} ms over the $2 ms budget"; exit 1; }; }
          check "decode one mainnet checkpoint" 2
          check "species + local recall" 20

  # ── STAGE 6: Deploy (main only) ──────────────────────────────────────────
  deploy:
    name: "Stage 6 · Deploy to rimba.edycu.dev"
    # Production deploy of the reef (web/) after every green push to main.
    # Needs repo secret VERCEL_TOKEN; org/project ids are not secret.
    needs: [check, secret-scan, dependency-audit, build, e2e, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://rimba.edycu.dev
    env:
      VERCEL_ORG_ID: team_RJcQx4a22v5LqjetHv8HhhLY
      VERCEL_PROJECT_ID: prj_gaxBT2wBMJXHj5FZP68gFpW6qYWy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes vercel@53.2.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@53.2.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@53.2.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        run: curl -fsS -o /dev/null -w "%{http_code}\n" https://rimba.edycu.dev/
