name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          # Code scanning uploads need a public repo (or Advanced Security). While the repo is private the analysis
          # still runs on every push and fails the job on errors; results upload once the repo is public.
          upload: ${{ github.event.repository.private == false && 'always' || 'never' }}
